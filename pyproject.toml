[project]
name = "forgemesh-demo"
version = "0.1.0"
description = "Local-first ForgeMesh software-engineering multi-agent demo."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.pytest-tmp"

[tool.uv]
default-groups = ["dev"]
